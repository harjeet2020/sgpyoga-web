[build]
  command = "npm run build"
  publish = "_site"

# Node 22 for the content build (scripts/content), which relies on the
# built-in fetch and process.loadEnvFile. SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY are set in the Netlify UI, not here.
[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Redirects
#
# Every rule here uses `force = true`. Without it Netlify serves a matching
# file first and never reaches the rule. That's why the old `/blog` rule never
# fired: `/blog` matched `blog.html`, which then redirected with JavaScript.
# ---------------------------------------------------------------------------

# Canonical host: www → apex in ONE hop. Without these rules, Netlify upgrades
# http→https first and switches host second, so http://www took two redirects.
[[redirects]]
  from = "http://www.sgpyoga.co/*"
  to = "https://sgpyoga.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sgpyoga.co/*"
  to = "https://sgpyoga.co/:splat"
  status = 301
  force = true

# Blog entry points → the blog index, server-side (replaces the old
# JavaScript redirect page blog.html). Spanish-speaking browsers get the
# Spanish index, as blog.html used to do. The Language rules must come
# before the catch-all rules because Netlify uses the first match.
[[redirects]]
  from = "/blog"
  to = "/blog/dist/es/"
  status = 301
  force = true
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/blog/"
  to = "/blog/dist/es/"
  status = 301
  force = true
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/blog.html"
  to = "/blog/dist/es/"
  status = 301
  force = true
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/blog"
  to = "/blog/dist/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/blog/dist/"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog/dist/"
  status = 301
  force = true

# Headers for security and performance (optional)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML files - always check for updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

# CSS files - always check for updates
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/css; charset=utf-8"

# JS files - always check for updates
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/javascript; charset=utf-8"

# Static assets (images, fonts) - cache for 30 days
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
