# Old URLs: the indexes, then a catch-all for anything else under
# /blog/dist/ (index.html variants, the old search index, the duplicate asset
# copies that used to be deployed there). Specific rules must come first.

[[redirects]]
  from = "/blog/dist/es/*"
  to = "/es/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/dist/posts/es/*"
  to = "/es/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/dist/*"
  to = "/blog/"
  status = 301
  force = true

# Headers for security and performance (optional)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML files - always check for updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

# CSS files - always check for updates
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/css; charset=utf-8"

# JS files - always check for updates
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/javascript; charset=utf-8"

# Static assets (images, fonts) - cache for 30 days
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
